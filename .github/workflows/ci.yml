name: Swift Package CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lorisiot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
      - name: Verify narrow exceptions and scan all history
        shell: bash
        run: |
          export GITLEAKS_BIN="$RUNNER_TEMP/gitleaks-bin/gitleaks"
          python3 Scripts/security/test-gitleaks-policy.py
          "$GITLEAKS_BIN" git . --config .gitleaks.toml --log-opts=--all \
            --ignore-gitleaks-allow --gitleaks-ignore-path /dev/null --redact --no-banner

  test:
    name: Swift 6 tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Record toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build and test
        run: swift test --scratch-path "$RUNNER_TEMP/lorisiot-build"

      - name: CocoaMQTT loopback socket contracts
        env:
          LORISIOT_TEST_SCRATCH: ${{ runner.temp }}/lorisiot-build
        run: python3 Scripts/mqtt/run-loopback-tests.py

  home-assistant:
    name: Isolated Home Assistant scheduling contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Python 3.14
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.14'
      - name: Pure server tests
        run: python -B -m unittest discover -s Server/HomeAssistant/tests -v
      - name: Install isolated HA test dependencies
        run: python -m pip install -r Server/HomeAssistant/requirements-qualification.txt
      - name: HTTP and runtime integration tests (localhost fixtures only)
        run: python -B -m unittest discover -s Server/HomeAssistant/integration_tests -v
