name: Swift Package CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lorisiot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Swift 6 tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Record toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build and test
        run: swift test --scratch-path "$RUNNER_TEMP/lorisiot-build"

  home-assistant:
    name: Isolated Home Assistant scheduling contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Python 3.14
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.14'
      - name: Pure server tests
        run: python -B -m unittest discover -s Server/HomeAssistant/tests -v
      - name: Install isolated HA test dependencies
        run: python -m pip install -r Server/HomeAssistant/requirements-qualification.txt
      - name: HTTP and runtime integration tests (localhost fixtures only)
        run: python -B -m unittest discover -s Server/HomeAssistant/integration_tests -v
